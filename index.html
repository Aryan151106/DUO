<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FFFDF7" />
    <meta name="description" content="AV — Aryan & Vidhi's private shared space." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AV" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=DynaPuff:wght@600;700&family=Fredoka:wght@400;500;600;700&family=Spicy+Rice&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
      :root {
        --bg: #EDEDE8;
        --card: #FFFFFF;
        --ink: #101114;
        --a: #FF5A1F;
        --b: #FFE600;
        --c: #2B50FF;
        --d: #00C46A;
        --on: #101114;
        --mut: #5A5D66;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #14151A;
          --card: #23252E;
          --ink: #F4F4EE;
          --mut: #A3A6B3;
        }
      }
      :root[data-theme="dark"], :root[data-mode="dark"] {
        --bg: #14151A;
        --card: #23252E;
        --ink: #F4F4EE;
        --mut: #A3A6B3;
      }
      #ld {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--b, #FFE600);
      }
      #ld .p {
        position: absolute;
        top: 0;
        height: 100%;
        width: 25.2%;
        background: var(--b, #FFE600);
        transition: transform .7s cubic-bezier(.7,0,.3,1);
      }
      #ld .p:nth-child(1) { left: 0; transition-delay: 0s; }
      #ld .p:nth-child(2) { left: 25%; transition-delay: .08s; }
      #ld .p:nth-child(3) { left: 50%; transition-delay: .16s; }
      #ld .p:nth-child(4) { left: 75%; transition-delay: .24s; }
      #ld.out .p { transform: translateY(-101%); }
      .lw {
        position: relative;
        background: var(--card);
        padding: 26px 34px 22px;
        border-radius: 34px 12px 30px 12px;
        box-shadow: 10px 10px 0 var(--ink);
        text-align: center;
        transition: transform .45s cubic-bezier(.6,-.4,.8,.4);
        z-index: 10;
      }
      #ld.out .lw { transform: scale(0) rotate(25deg); }
      .lr {
        display: flex;
        justify-content: center;
        gap: .05em;
        margin-bottom: 8px;
        flex-direction: column;
        align-items: center;
        position: relative;
      }
      .lr svg {
        width: clamp(130px, min(34vw, 30vh), 200px);
        height: auto;
        display: block;
        overflow: visible;
        transform-origin: 50% 100%;
        animation: wig 1.1s ease-in-out 2.6s infinite;
      }
      #la, #lv {
        transform-box: fill-box;
        transform-origin: 50% 100%;
      }
      #la {
        animation: scoop 1.3s cubic-bezier(.3,1.3,.5,1) .6s both;
      }
      #lv {
        animation: cone .7s cubic-bezier(.3,1.5,.5,1) both;
      }
      .cg {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: chd .6s cubic-bezier(.3,1.6,.5,1) 2.2s both;
      }
      @keyframes cone {
        from { transform: translateY(110vh) rotate(40deg); }
      }
      @keyframes scoop {
        0% { transform: translateY(-120vh) rotate(-30deg); }
        55% { transform: translateY(0) scale(1.1, .7); }
        70% { transform: translateY(-20px) scale(.92, 1.12); }
        85% { transform: scale(1.05, .95); }
        100% { transform: none; }
      }
      @keyframes wig {
        50% { transform: rotate(-3deg) scale(1.03, .97); }
      }
      @keyframes chd {
        from { transform: translateY(-700%); opacity: 0; }
      }
      .dt {
        fill: none;
        stroke: currentColor;
        stroke-width: 20;
        stroke-linecap: round;
        stroke-dasharray: var(--L);
        animation: dtg var(--t) ease-in-out var(--d) infinite backwards;
      }
      .dd {
        fill: currentColor;
        animation: ddg var(--t) cubic-bezier(.5,0,1,.7) var(--d) infinite backwards;
      }
      .db { display: none; }
      @keyframes dtg {
        0% { stroke-dashoffset: var(--L); }
        55%, 70% { stroke-dashoffset: 0; }
        80% { stroke-dashoffset: calc(var(--L) * .7); }
        100% { stroke-dashoffset: var(--L); }
      }
      @keyframes ddg {
        0%, 69% { opacity: 0; transform: translateY(var(--L)); }
        70% { opacity: 1; transform: translateY(var(--L)); }
        100% { opacity: 0; transform: translateY(calc(var(--L) + 40px)); }
      }
      #ld u {
        display: inline-block;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: color-mix(in srgb, var(--ink) 18%, transparent);
        margin: 0 3px;
        text-decoration: none;
        transition: background .1s;
      }
      #ld u.f {
        animation: bp .35s cubic-bezier(.3,1.8,.5,1);
        background: var(--a);
      }
      @keyframes bp {
        from { transform: scale(.2); }
      }
      #lt {
        margin-top: 14px;
        font-family: 'Bungee', sans-serif;
        font-size: 18px;
        color: var(--ink);
        letter-spacing: 0.5px;
      }
      .sp {
        display: block;
        position: absolute;
        width: 7px;
        height: 16px;
        border-radius: 3px;
        z-index: 3;
        text-decoration: none;
        animation: spr .5s cubic-bezier(.3,1.6,.5,1) both, spw .9s ease-in-out infinite alternate;
      }
      @keyframes spr {
        from { transform: scale(0); }
      }
      @keyframes spw {
        to { transform: translateY(-7px) rotate(35deg); }
      }
    </style>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('duo_theme') || 'hazard';
          var savedMode = localStorage.getItem('duo_mode') || 'auto';
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolvedMode = savedMode === 'auto' ? (systemDark ? 'dark' : 'light') : savedMode;
          document.documentElement.setAttribute('data-theme', savedTheme);
          document.documentElement.setAttribute('data-app-theme', savedTheme);
          document.documentElement.setAttribute('data-mode', resolvedMode);
        } catch (e) {}
      })();
    </script>
    <!-- OneSignal Web Push SDK (deferred load; initialized authoritatively in src/lib/oneSignal.ts) -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <title>AV — Aryan & Vidhi</title>
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)] font-body antialiased selection:bg-[var(--accent)] selection:text-[var(--text)] overflow-x-hidden">
    <!-- Instant Pre-mount AV Ice Cream Loading Animation -->
    <div id="ld">
      <i class="p"></i><i class="p"></i><i class="p"></i><i class="p"></i>
      <div class="lw">
        <div class="lr">
          <svg viewBox="-10 -30 220 380" role="img" aria-label="AV ice cream">
            <g id="lv">
              <path d="M30 124Q62 245 100 318Q138 245 170 124Z" fill="#E9A23B"/>
              <clipPath id="cc-pre"><path d="M30 124Q62 245 100 318Q138 245 170 124Z"/></clipPath>
              <g clip-path="url(#cc-pre)" stroke="#B8651B" stroke-width="4">
                <path d="M0 150L200 250M0 190L200 290M0 230L200 330M0 270L200 370M200 150L0 250M200 190L0 290M200 230L0 330M200 270L0 370"/>
              </g>
              <path d="M30 124Q62 245 100 318Q138 245 170 124" fill="none" stroke="var(--ink)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
            </g>
            <g id="la" style="color:var(--a)">
              <path fill="currentColor" d="M22 130C14 70 50 18 100 18C150 18 186 70 178 130L178 158Q178 172 164 172Q150 172 150 158L150 140Q150 130 138 130L62 130Q50 130 50 140L50 158Q50 172 36 172Q22 172 22 158Z"/>
              <polygon points="100,60 89,84 111,84" fill="var(--card)" stroke="var(--card)" stroke-width="16" stroke-linejoin="round"/>
              <g class="dg" style="--L:12px;--d:2.1s;--t:3.4s"><path class="dt" d="M80 130v12"/><circle class="dd" cx="80" cy="130" r="10"/></g>
              <g class="dg" style="--L:18px;--d:2.9s;--t:3.8s"><path class="dt" d="M118 130v18"/><circle class="dd" cx="118" cy="130" r="10"/></g>
              <g class="dg" style="--L:14px;--d:2.5s;--t:3.2s"><path class="dt" d="M36 172v14"/><circle class="dd" cx="36" cy="172" r="10"/></g>
              <g class="dg" style="--L:20px;--d:3.1s;--t:4s"><path class="dt" d="M164 172v20"/><circle class="dd" cx="164" cy="172" r="10"/></g>
              <g class="cg">
                <circle cx="100" cy="12" r="14" fill="#E11D2E"/>
                <path d="M100 -2Q102 -16 116 -22" stroke="#8A4A12" stroke-width="4" fill="none" stroke-linecap="round"/>
              </g>
            </g>
          </svg>
        </div>
        <div class="lb">
          <u></u><u></u><u></u><u></u><u></u><u></u><u></u><u></u><u></u><u></u><u></u><u></u>
        </div>
        <div id="lt">SCOOPING… 0%</div>
      </div>
    </div>
    <script>
      (function(){
        try {
          var L = document.getElementById('ld');
          if (!L) return;
          var bx = L.querySelectorAll('u');
          var t = document.getElementById('lt');
          var lr = L.querySelector('.lr');
          if (lr) {
            var SC = ['var(--a)', 'var(--b)', 'var(--c)', 'var(--d)'];
            for (var i = 0; i < 9; i++) {
              var s = document.createElement('s');
              s.className = 'sp';
              s.style.cssText = 'left:' + (18 + Math.random() * 64) + '%;top:' + (4 + Math.random() * 34) + '%;background:' + SC[i % 4] + ';transform:rotate(' + (Math.random() * 180 | 0) + 'deg);animation-delay:' + (2.1 + i * 0.07) + 's';
              lr.appendChild(s);
            }
          }
          var n = 0;
          var fi = setInterval(function() {
            if (n < bx.length) {
              bx[n].style.background = 'var(--a)';
              bx[n].classList.add('f');
              n++;
              if (t) {
                var pct = Math.round(n / bx.length * 100);
                t.textContent = (n < 5 ? 'SCOOPING… ' : n < 10 ? 'ADDING SPRINKLES… ' : 'ALMOST… ') + pct + '%';
              }
            } else {
              clearInterval(fi);
              if (t) t.textContent = 'ENJOY! 🍦';
              setTimeout(function() {
                L.classList.add('out');
                setTimeout(function() {
                  if (L && L.parentNode) L.parentNode.removeChild(L);
                }, 800);
              }, 400);
            }
          }, 180);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
