<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFDF7" />
    <meta name="description" content="AV — Aryan & Vidhi's private shared space." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AV" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Bangers&family=Bungee&family=Caveat+Brush&family=Chango&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Fredoka:wght@400;500;600;700&family=Gaegu:wght@400;700&family=Lilita+One&family=Nunito:ital,wght@0,400..700;1,400..700&family=Outfit:wght@400;500;600;700&family=Pacifico&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('duo_theme') || 'cozy-cream';
          var savedMode = localStorage.getItem('duo_mode') || 'auto';
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolvedMode = savedMode === 'auto' ? (systemDark ? 'dark' : 'light') : savedMode;
          document.documentElement.setAttribute('data-theme', savedTheme);
          document.documentElement.setAttribute('data-mode', resolvedMode);
        } catch (e) {}
      })();
    </script>
    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (isLocal) {
          console.info('[OneSignal] Localhost dev environment detected — push notifications active on https://av-space-311906.web.app');
          return;
        }
        try {
          await OneSignal.init({
            appId: "e0bb43d0-355d-48de-bb9f-0caf33039abb",
            allowLocalhostAsSecureOrigin: true,
            notifyButton: { enable: false }
          });
        } catch (e) {
          console.info('[OneSignal] Push notifications active on production domain: https://av-space-311906.web.app');
        }
      });
    </script>
    <title>AV — Aryan & Vidhi</title>
  </head>
  <body class="bg-[var(--bg)] text-[var(--text)] font-body antialiased selection:bg-[var(--accent)] selection:text-[var(--text)] overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
